services:
  hiremodus:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - hiremodus-data:/data
    environment:
      # Change these two before going live
      HIREMODUS_SECRET_KEY: "replace-with-a-long-random-string"
      HIREMODUS_ADMIN_PASSWORD: "ChangeMe123!"
      HIREMODUS_ADMIN_EMAIL: "admin@novamodus.com"
      HIREMODUS_PORTAL_URL: "https://hiremodus.example.com/portal"
      HIREMODUS_TZ: "America/Toronto"
      # Starts with Outlook simulated; switch off in Settings once connectors are running
      HIREMODUS_SIMULATE_OUTLOOK: "true"
    restart: unless-stopped

volumes:
  hiremodus-data:
